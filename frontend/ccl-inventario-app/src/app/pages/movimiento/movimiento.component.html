<div class="page-container">
  <header class="navbar">
    <span class="brand">CCL Inventario</span>
    <nav>
      <a routerLink="/inventario">Ver Inventario</a>
      <button class="btn-logout" (click)="logout()">Cerrar Sesión</button>
    </nav>
  </header>

  <main class="content">
    <h2>Registrar Movimiento</h2>

    <div class="alert success" *ngIf="mensaje">{{ mensaje }}</div>
    <div class="alert danger" *ngIf="error">{{ error }}</div>

    <form [formGroup]="form" (ngSubmit)="submit()" class="form-card">
      <div class="field">
        <label for="productoId">Producto</label>
        <select id="productoId" formControlName="productoId">
          <option value="">-- Selecciona un producto --</option>
          <option *ngFor="let p of productos" [value]="p.id">
            {{ p.nombre }} (Stock: {{ p.cantidad }})
          </option>
        </select>
        <span class="error-msg" *ngIf="form.get('productoId')?.invalid && form.get('productoId')?.touched">
          Selecciona un producto
        </span>
      </div>

      <div class="field">
        <label for="tipo">Tipo de Movimiento</label>
        <select id="tipo" formControlName="tipo">
          <option value="0">Entrada</option>
          <option value="1">Salida</option>
        </select>
      </div>

      <div class="field">
        <label for="cantidad">Cantidad</label>
        <input
          id="cantidad"
          type="number"
          formControlName="cantidad"
          placeholder="Ej: 5"
          min="1"
        />
        <span class="error-msg" *ngIf="form.get('cantidad')?.invalid && form.get('cantidad')?.touched">
          La cantidad debe ser mayor a 0
        </span>
      </div>

      <button type="submit" [disabled]="loading">
        {{ loading ? 'Guardando...' : 'Registrar Movimiento' }}
      </button>
    </form>
  </main>
</div>
